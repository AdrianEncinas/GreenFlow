spring.application.name=sensor-service
server.port=8085
# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Topic
sensor.kafka.topic=sensor-readings
sensor.scheduler.fixed-rate-ms=300000

# Console logging
logging.level.com.GreenFlow.sensor_service=INFO

jwt.secret=${JWT_SECRET:greenflow-super-secret-key-please-change-in-production-2026}
jwt.issuer=${JWT_ISSUER:greenflow-auth-service}
