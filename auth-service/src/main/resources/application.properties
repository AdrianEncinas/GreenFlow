spring.application.name=v1
server.port=8080
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:greenflow-super-secret-key-please-change-in-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.issuer=${JWT_ISSUER:greenflow-auth-service}

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
app.bootstrap-admin.role=${BOOTSTRAP_ADMIN_ROLE:ROLE_ADMIN}
