spring.application.name=greenhouse-core
server.port=8082

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/greenflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka Consumer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=greenhouse-core
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.reconnect.backoff.ms=2000
spring.kafka.consumer.properties.reconnect.backoff.max.ms=10000
spring.kafka.listener.missing-topics-fatal=false

# Topics
sensor.kafka.topic=sensor-readings

# JPA
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:greenflow-super-secret-key-please-change-in-production-2026}
jwt.issuer=${JWT_ISSUER:greenflow-auth-service}
