services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: greenflow-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: greenflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    volumes:
      - kafka_data:/var/lib/kafka/data

  postgres:
    image: postgres:16
    container_name: greenflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: greenflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greenflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./auth-service
    container_name: greenflow-auth-service
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      JWT_SECRET: greenflow-super-secret-key-please-change-in-production-2026
      JWT_EXPIRATION_MS: 3600000
      JWT_ISSUER: greenflow-auth-service

  greenhouse-core:
    build:
      context: ./greenhouse-core
    container_name: greenflow-greenhouse-core
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/greenflow
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: greenflow-super-secret-key-please-change-in-production-2026
      JWT_ISSUER: greenflow-auth-service

  sensor-service:
    build:
      context: ./sensor-service
    container_name: greenflow-sensor-service
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: greenflow-super-secret-key-please-change-in-production-2026
      JWT_ISSUER: greenflow-auth-service

  frontend:
    build:
      context: ./frontend
    container_name: greenflow-frontend
    depends_on:
      - auth-service
      - greenhouse-core
    ports:
      - "4200:80"

volumes:
  zookeeper_data:
  kafka_data:
  postgres_data:
